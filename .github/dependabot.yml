version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: [ci, dependencies]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    # fastf1 requires pandas<3, so a major pandas bump can never install.
    ignore:
      - dependency-name: pandas
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
