name: Next

# Backup for the hourly task on Rainer's PC: runs whatever step is still due if the PC was off.
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: next
  cancel-in-progress: false

jobs:
  next:
    name: next
    if: github.repository == 'rdgonzaga/f1-prediction'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt && pip install -e .

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run next
        id: next
        run: |
          before=$(git rev-parse HEAD)
          python -m f1pred next --publish
          echo "moved=$([ "$(git rev-parse HEAD)" != "$before" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Deploy Pages
        if: steps.next.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
